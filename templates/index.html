<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapEmail Extractor - Free Google Maps Email Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold text-center mb-6">MapEmail Extractor</h1>
        <p class="text-center text-gray-600 mb-8">Extract business emails from Google Maps for lead generation.</p>
        
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <div class="mb-4">
                <label for="searchTerm" class="block text-sm font-medium text-gray-700">Search Term</label>
                <input type="text" id="searchTerm" placeholder="e.g., dental clinics in London" class="mt-1 block w-full p-2 border rounded-md">
            </div>
            <div class="flex space-x-4">
                <button id="scrapeBtn" class="flex-1 bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700">Start Scraping</button>
                <button id="stopBtn" class="d-none flex-1 bg-red-600 text-white p-2 rounded-md hover:bg-red-700">Stop Scraping</button>
            </div>
        </div>
        
        <div id="progress" class="d-none bg-blue-100 p-4 rounded-md mb-6">
            <p id="progressText" class="text-blue-700"></p>
            <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
        </div>
        
        <div id="businessResults" class="d-none bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Scraped Businesses</h2>
            <table class="w-full table-auto mb-4">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="px-4 py-2">Business Name</th>
                        <th class="px-4 py-2">Website</th>
                        <th class="px-4 py-2">Actions</th>
                    </tr>
                </thead>
                <tbody id="businessTable"></tbody>
            </table>
            <button id="saveBusinessesBtn" class="bg-green-600 text-white p-2 rounded-md hover:bg-green-700">Save to CSV and Proceed</button>
        </div>
        
        <div id="emailResults" class="d-none bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Scraped Emails</h2>
            <table class="w-full table-auto mb-4">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="px-4 py-2">Business Name</th>
                        <th class="px-4 py-2">Website</th>
                        <th class="px-4 py-2">Email</th>
                        <th class="px-4 py-2">Actions</th>
                    </tr>
                </thead>
                <tbody id="emailTable"></tbody>
            </table>
            <div class="flex space-x-4">
                <button id="saveEmailsBtn" class="bg-green-600 text-white p-2 rounded-md hover:bg-green-700">Save to CSV and Next Batch</button>
                <a id="downloadEmails" class="d-none bg-green-600 text-white p-2 rounded-md hover:bg-green-700" href="/download/emails.csv">Download Emails CSV</a>
            </div>
        </div>
    </div>
    
    <!-- Modal for Permission -->
    <div id="permissionModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full">
            <h2 id="modalTitle" class="text-xl font-semibold mb-4">Permission to Scrape</h2>
            <p id="modalMessage" class="mb-4"></p>
            <div class="flex space-x-4">
                <button id="proceedBtn" class="bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700">Proceed</button>
                <button id="cancelBtn" class="bg-red-600 text-white p-2 rounded-md hover:bg-red-700">Cancel</button>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
