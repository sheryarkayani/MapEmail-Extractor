<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MapEmail Extractor - Free Google Maps email scraper for business email extraction. Scrape dental clinics, restaurants, and more for lead generation.">
    <meta name="keywords" content="free email scraper, Google Maps email extractor, business email finder, dental clinics email scraper, lead generation tool">
    <meta name="author" content="Sheryar Kayani">
    <title>MapEmail Extractor - Free Google Maps Email Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">MapEmail Extractor</h1>
        <p class="text-center lead">Free Google Maps Email Scraper for Business Lead Generation</p>

        <!-- Input Form -->
        <div class="card p-4 mb-4">
            <h2 class="h4 mb-3">Scrape Business Emails</h2>
            <div class="mb-3">
                <label for="searchTerm" class="form-label">Enter Search Term (e.g., dental clinics in London):</label>
                <input type="text" class="form-control" id="searchTerm" placeholder="e.g., dental clinics in London">
            </div>
            <button class="btn btn-primary" id="scrapeBtn">Start Scraping</button>
        </div>

        <!-- Progress Display -->
        <div id="progress" class="alert alert-info d-none">
            <p id="progressText">Starting...</p>
        </div>

        <!-- Results Table -->
        <div id="results" class="d-none">
            <h2 class="h4 mb-3">Scraping Results</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Website</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="resultsTable"></tbody>
            </table>
            <div class="mt-3">
                <a id="downloadWebsites" class="btn btn-success me-2 d-none" href="#">Download websites.csv</a>
                <a id="downloadEmails" class="btn btn-success d-none" href="#">Download emails.csv</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/script.js"></script>
</body>
</html>
